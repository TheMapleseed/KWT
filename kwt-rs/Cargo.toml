[package]
name = "kwt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "KDL Web Token — reference implementation"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheMapleseed/KWT"
documentation = "https://docs.rs/kwt"
keywords = ["kwt", "token", "aead", "jwt", "kdl"]
categories = ["cryptography", "authentication"]

[dependencies]
# Cryptography — all from the audited RustCrypto project
chacha20poly1305 = "0.10"
aes-gcm          = "0.10"
hkdf             = "0.12"
sha2             = "0.10"

# Utilities
rand             = "0.8"
uuid             = { version = "1", features = ["v7"] }
zeroize          = { version = "1", features = ["derive"] }
base64ct         = { version = "1", features = ["alloc"] }
thiserror        = "1"

[dev-dependencies]
hex-literal = "0.4"
