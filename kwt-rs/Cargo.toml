[package]
name = "kwt"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "KDL Web Token (KWT) — production Rust implementation"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/TheMapleseed/KWT"
homepage = "https://github.com/TheMapleseed/KWT"
documentation = "https://docs.rs/kwt"
# Published crate tarball: sources + license only (no `deny.toml` / CI-only files).
include = ["LICENSE", "README.md", "Cargo.toml", "src/**/*.rs"]
keywords = ["kwt", "token", "aead", "jwt", "kdl"]
categories = ["cryptography", "authentication"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# OS CSPRNG for master keys and XChaCha nonces; AEAD + HKDF + SHA-256 are in-tree (`src/primitive/`).
getrandom        = { version = "0.2", features = ["std"] }

uuid             = { version = "1", features = ["v7"] }
zeroize          = { version = "1", features = ["derive"] }
base64ct         = { version = "1", features = ["alloc"] }
thiserror        = "1"

[dev-dependencies]
hex-literal = "0.4"
